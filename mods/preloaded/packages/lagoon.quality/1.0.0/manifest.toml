# Lagoon quality-of-life package. Everything here is opt-in and off by default,
# so an untouched install plays the faithful game. Each feature names the trusted
# plugin registered by src/lagoon_qol.c; the runtime refuses an enabled feature
# whose plugin id this build never registered, which is why only features that
# actually exist are declared.

format_version = 1
id = "lagoon.quality"
version = "1.0.0"
name = "Lagoon Quality of Life"
author = "LagoonSNESRecomp"
description = "Opt-in gameplay comfort changes, each off by default."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "lagoon-usa"
rom_sha256 = "46c811f0cacffe8f20e1d63072d25d7c47e9bb3fd5124851fd05aca9884d21fb"

[[feature]]
id = "walk_speed"
name = "Faster walking"
description = "Walking covers 5 pixels per applied frame instead of 3, using the speed tier the game already contains."
group = "Movement"
default_enabled = false

[[plugin]]
feature = "walk_speed"
id = "lagoon.qol.walk_speed"

[[feature]]
id = "start_hp"
name = "Start with 18 HP"
description = "New games start with 18 HP and 11 base defence. Level 2 is 21 HP and 13 base defence; level 3 and later retain stock growth."
group = "Stats"
default_enabled = false

[[plugin]]
feature = "start_hp"
id = "lagoon.qol.start_hp"

[[feature]]
id = "camera_center"
name = "Immediate camera following"
description = "The view stays centred on Nasir instead of only scrolling once he reaches the edge of the screen. Kept inside the room, so no outside-map is shown."
group = "Camera"
default_enabled = false

[[plugin]]
feature = "camera_center"
id = "lagoon.qol.camera_center"

# Historical note: this was briefly pulled because switching it on did nothing. The
# cause was here, not in the runtime: mod_runtime_activate_plugins() clears the
# frame-callback list and then re-runs activation callbacks at every session start,
# so a callback registered from the static constructor -- which runs before main --
# is gone before the first frame, while registration still reports success. The
# activation callback is both the place the registration survives and the place the
# feature's on/off state is known.

[[feature]]
id = "debug_position"
name = "Development: start on a chosen tile"
description = "Harness hook, not a player feature. With the environment variable LAGOON_DEBUG_AT=x,y[,frame] set, Nasir is moved to that world position once, at that frame. Unset means no change at all. Used to probe doors, warps and dialogue squares exactly, and to build campaign checkpoints."
group = "Development"
default_enabled = false

[[plugin]]
feature = "debug_position"
id = "lagoon.qol.debug_position"

[[feature]]
id = "sword_reach"
name = "Longer sword reach"
description = "Extends the directional sword hit rectangles to 38 pixels, matching the supplied QoL patch."
group = "Combat"
default_enabled = false

[[plugin]]
feature = "sword_reach"
id = "lagoon.qol.sword_reach"

[[feature]]
id = "follower_speed"
name = "Faster followers"
description = "Following allies use 3 pixels per applied movement frame instead of 1. Enemy movement is unchanged."
group = "Movement"
default_enabled = false

[[plugin]]
feature = "follower_speed"
id = "lagoon.qol.follower_speed"

[[feature]]
id = "recovery_time"
name = "Extra recovery time"
description = "Adds eight frame ticks before the ordinary-hit protection counter can expire."
group = "Combat"
default_enabled = false

[[plugin]]
feature = "recovery_time"
id = "lagoon.qol.recovery_time"

[[feature]]
id = "jump_hold"
name = "More comfortable jumps"
description = "Holds the original jump peak for eight frame ticks, preserving horizontal movement."
group = "Movement"
default_enabled = false

[[plugin]]
feature = "jump_hold"
id = "lagoon.qol.jump_hold"

[[feature]]
id = "magic_power"
name = "Stronger magic"
description = "Increases every nonzero player magic power by 50 percent, rounded down. Enemy projectile powers are unchanged."
group = "Combat"
default_enabled = false

[[plugin]]
feature = "magic_power"
id = "lagoon.qol.magic_power"

[[feature]]
id = "exp_boost"
name = "Less grinding"
description = "Enemy and boss EXP rewards increase by 50 percent, rounded down to whole numbers. Zero-reward phase records stay zero."
group = "Stats"
default_enabled = false

[[plugin]]
feature = "exp_boost"
id = "lagoon.qol.exp_boost"

[[feature]]
id = "fast_menus"
name = "Legacy menu-speed compatibility"
description = "Deprecated compatibility alias for old settings. Menu responsiveness is built into the port and this switch has no effect."
group = "Interface"
default_enabled = false

[[plugin]]
feature = "fast_menus"
id = "lagoon.qol.fast_menus"
