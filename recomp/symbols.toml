# Progressive symbol map for Lagoon.
#
# Each [[func]] names an address the analyzer should treat as a function.
# Set emit = true to promote one into ahead-of-time codegen; leave it false
# to keep it interpreted. tools/regen.sh syncs labels and tier choices into
# each recomp/bankNN.cfg; only emit=true adds a func/funcs.h declaration.
# Do not hand-edit the generated blocks in the bank configs.
#
# Everything below the vectors came out of a coverage capture of a real route
# (tools/headless.ps1 -Coverage with tools/script_intro.txt, read back with
# tools/dispatch_hints.py): callees the generated code already reached, but not
# in the register-width variant the caller was using, so the call dropped to the
# interpreter every single time. entry_m/entry_x record the width the machine
# actually arrives in — that is evidence, not a guess.

