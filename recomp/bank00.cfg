# Lagoon (USA) — LLE-first seed
# Regenerate with tools/regen.sh. Promote functions by editing recomp/symbols.toml
# and re-running the regen script, which rewrites the block below.
bank = 0
auto_vectors
tier_down_stubs

# Reset vector $8013, native NMI $87b4 (from the cartridge header).

# The bank routine glue constructs 24-bit pointers in page zero from each
# bank's $8000 routine table. This includes title/menu and gameplay routines,
# not only sound code.
# The $80E6 pointer call is intentionally kept on the interpreter tier. The
# old two-target authorization omitted $01:807A (main gameplay), and generated
# CALL-form dispatch misses discard the guest call instead of executing it.
# This silently returned to $00:9366 and restarted the opening loop after the
# old man's dialogue. Other bank-$01/$02 table entries are needed by gameplay
# too: keep the live ROM dispatcher authoritative until its full target set
# and all call/return paths have been qualified.
#
# $80E6 is reached by `JSL $80E6` from the trampoline at $80CB — the JSL at
# $80DE pushes $80E2, and the handler's RTL pops that frame, so the block
# resumed after the handler is $80E2 and not the jump's lexical successor
# $80E9. Any future AOT authorization must preserve that remote continuation
# and three-byte frame (return:80e2 frame:3), not invent a lexical return.
# $8106 is a plain tail: the trampoline copies a 24-bit pointer from a page-$01
# table into $0004 and long-jumps it; the handler returns to the trampoline's
# caller. Its seven targets are every destination the capture saw.
force_lle 0080e6
indirect_dispatch 8106 7 ptrtail targets:0287e2,02882a,028838,028856,028887,02892f,028938

# >>> BEGIN symbols.toml (generated — do not edit)
symbol 008013 I_RESET
force_lle 008013
func F_0080B3 80b3 entry_mx:1,0
func F_0080B9 80b9 entry_mx:1,0
symbol 008211 Lagoon_Oam_StageSprite
force_lle 008211
symbol 0087b4 I_NMI
force_lle 0087b4
# <<< END symbols.toml

# Damage RNG stays interpreted, including its hardware division.
func Lagoon_RandomDamageBoundary 9800 entry_mx:1,0
force_lle 009800
force_lle 009848
# Only REP20 at981A; all normal returns pass SEP20 at983A; X unchanged.
exit_mx_variant 009800 1 0 1 0

# Queue wait preserves widths; retain original timing/PPU polling in LLE.
func Lagoon_DmaWaitBoundary 8985 entry_mx:1,0
force_lle 008985
exit_mx_variant 008985 1 0 1 0

# Generic HUD dispatcher remains LLE; accept every returned width.
exit_mx_set 0080b9 M1X0 M0X0,M0X1,M1X0,M1X1
