# Dispatcher at $C654: `LDA $C657,y / STA $26 / LDA $C658,y / STA $27 / PLY /
# JMP ($0026)`. The PLY puts Y back before the jump, so the `idx:` form has no
# register left to read — this is the pointer-match idiom, with the table's
# distinct handlers listed straight off ROM:
#   C657: 83 c6 88 c6 db c6 26 c7 26 c7 26 c7 26 c7 26 c7 26 c7
# Nine slots, four different handlers (the last six are all $C726, which starts
# `PHX / LDA $0417 / SEC` — a real routine, not padding). Execution reached
# $C726 at frame 774 through an unresolved abandon; the rest come from the table.
indirect_dispatch c654 4 ptrtail targets:c683,c688,c6db,c726
