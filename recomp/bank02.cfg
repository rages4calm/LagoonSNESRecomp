# Dispatcher at $DF3D: `PHY / ASL / TAY / LDA $DF40,y / STA $26 / LDA $DF41,y /
# STA $27 / PLY / JMP ($0026)`. Y is restored before the jump, so there is no
# index register left for the `idx:` form to read; the pointer-match form takes
# the seven targets straight from the table, which ends where code resumes at
# $DF4E:
#   DF40: 4e df 58 df e0 df 62 e0 89 e0 f7 e0 24 e1
# Two of the seven ($DF4E at frame 170, $DF58 at frame 337) were observed in
# execution — they are the two that an unresolved abandon was swallowing, which
# is what kept the KEMCO logo and the first scene from ever being drawn.
